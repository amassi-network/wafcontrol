# Forward only WAFControl security events to MapAttack over RFC3164/TCP.
# Security events must never be collapsed as "last message repeated".
$RepeatedMsgReduction off

# Install as /etc/rsyslog.d/60-wafcontrol-mapattack.conf.
# Change both the collector target and sensor address for another deployment.
template(
    name="WafControlMapAttackFormat"
    type="string"
    string="<%pri%>%timegenerated:::date-rfc3164% 46.28.168.244 %syslogtag%%msg%\n"
)

ruleset(name="WafControlMapAttackRuleset") {
    action(
        type="omfwd"
        target="46.28.168.76"
        port="514"
        protocol="tcp"
        TCP_Framing="traditional"
        template="WafControlMapAttackFormat"
        action.resumeRetryCount="-1"
        queue.type="LinkedList"
        queue.filename="wafcontrol_mapattack"
        queue.saveOnShutdown="on"
        queue.maxDiskSpace="256m"
    )
}

input(
    type="imuxsock"
    Socket="/run/wafcontrol/syslog.sock"
    CreatePath="on"
    FlowControl="on"
    RateLimit.Interval="0"
    ruleset="WafControlMapAttackRuleset"
)

if ($programname == "wafcontrol") then {
    call WafControlMapAttackRuleset
    stop
}
