# Forward only WAFControl security events to MapAttack over RFC3164/TCP.
# Install as /etc/rsyslog.d/60-wafcontrol-mapattack.conf.
if ($programname == "wafcontrol") then {
    action(
        type="omfwd"
        target="46.28.168.76"
        port="514"
        protocol="tcp"
        TCP_Framing="traditional"
        template="RSYSLOG_TraditionalForwardFormat"
        action.resumeRetryCount="-1"
        queue.type="LinkedList"
        queue.filename="wafcontrol_mapattack"
        queue.saveOnShutdown="on"
        queue.maxDiskSpace="256m"
    )
    stop
}
